# The MCP servers behind the MCP showcases. Each is a backend the gateway's MCP
# proxies relay to -- like an LLM provider for the LLM lanes, not part of the
# gateway. They sit on the ai-demo-mcp network (created by scripts/run-local.sh;
# on a VM, `docker network create ai-demo-mcp` once), shared with
# gateway-runtime, which calls them, and with AI Workspace's platform-api, which
# fetches their tools when a proxy is created. No host port.
#
# What they offer comes with the business the demo is set for (DEMO_VERTICAL,
# verticals/): one code, two tool sets.
x-mcp-server: &mcp-server
  image: python:3.12-alpine
  command: ["python", "-u", "/app/server.py"]
  volumes:
    - ./server.py:/app/server.py:ro
    - ../verticals:/verticals:ro
  mem_limit: 64m
  networks:
    - mcp

services:
  # The business's own server: its catalogue and the signed-in customer's account.
  mcp-acme:
    <<: *mcp-server
    environment:
      - VERTICAL=${DEMO_VERTICAL:-mobile}
      - TOOLSET=core

  # A partner's server: a tool description and a tool result hide an
  # instruction to the agent.
  mcp-partner:
    <<: *mcp-server
    environment:
      - VERTICAL=${DEMO_VERTICAL:-mobile}
      - TOOLSET=partner

networks:
  mcp:
    external: true
    name: ${DEMO_NAME:-ai-demo}-mcp
