# The A2A Gateway page's gateway (A2A_ENABLED in demo.env): the main gateway's
# own definition and configuration (../ai-gateway), on the version in
# A2A_GATEWAY_VERSION (demo.env), and the agent behind it. scripts/a2a-compose.sh starts it next to the
# main gateway, which is not touched.
#
# It runs on its own: it is not registered in AI Workspace, which does not
# handle agents yet. The provisioning deploys the agents through its
# management API. It publishes only the two ports the demo uses, one above the
# main gateway's.
services:
  gateway-controller:
    image: ghcr.io/wso2/api-platform/gateway-controller:${A2A_GATEWAY_VERSION:?set A2A_GATEWAY_VERSION in demo.env}
    environment:
      - APIP_GW_CONTROLLER_CONTROLPLANE_HOST=
      - APIP_GW_CONTROLLER_CONTROLPLANE_TOKEN=
    ports: !override
      - "${A2A_GATEWAY_CONTROLLER_REST_PORT}:9090"

  gateway-runtime:
    image: ghcr.io/wso2/api-platform/gateway-runtime:${A2A_GATEWAY_VERSION:?set A2A_GATEWAY_VERSION in demo.env}
    ports: !override
      - "${A2A_GATEWAY_HTTPS_PORT}:8443"

  # The business's own agent; what it answers comes with the business the
  # demo plays (DEMO_VERTICAL).
  acme-agent:
    build: ../a2a/agent
    image: ${DEMO_NAME:-ai-demo}-a2a-agent:latest
    environment:
      - VERTICAL=${DEMO_VERTICAL:-telco}
      - ROLE=agent
      # The address the agent advertises in its card: the one the gateway reaches it on.
      - PUBLIC_URL=http://acme-agent:8000
    volumes:
      - ../verticals:/verticals:ro
    mem_limit: 128m
    networks:
      - gateway-network

  # A partner's agent, from the same code: its own card hides an instruction
  # for the agents that read it.
  partner-agent:
    build: ../a2a/agent
    image: ${DEMO_NAME:-ai-demo}-a2a-partner:latest
    environment:
      - VERTICAL=${DEMO_VERTICAL:-telco}
      - ROLE=partner
      - PUBLIC_URL=http://partner-agent:8000
    volumes:
      - ../verticals:/verticals:ro
    mem_limit: 128m
    networks:
      - gateway-network
